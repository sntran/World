\* The fault model: a change forgets that a task that it keeps is done
\* (KeepGuard = FALSE). The checker must find a task that started, is not
\* done, and that nobody works on (KeepsWhatIsSame is violated).
SPECIFICATION Spec
CONSTANTS
    Builds <- MCBuilds
    Tasks <- MCTasks
    BuildOf <- MCBuildOf
    Waits <- MCWaits
    Trade <- MCTrade
    People <- MCPeople
    Skill <- MCSkill
    Budget <- MCBudget
    Pauses = 1
    Guard = TRUE
    HireGuard = TRUE
    PauseGuard = TRUE
    KeepGuard = FALSE
    Hauled <- MCHauled
    PartsGuard = TRUE
INVARIANT KeepsWhatIsSame
