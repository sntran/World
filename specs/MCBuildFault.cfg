\* The fault model: a task can start again (Guard = FALSE). The checker
\* must find a task that is made again (MadeOnce is violated).
SPECIFICATION Spec
CONSTANTS
    Builds <- MCBuilds
    Tasks <- MCTasks
    BuildOf <- MCBuildOf
    Waits <- MCWaits
    Trade <- MCTrade
    People <- MCPeople
    Skill <- MCSkill
    Budget <- MCBudget
    Guard = FALSE
    HireGuard = TRUE
INVARIANT MadeOnce
