    Guard = TRUE
    HireGuard = TRUE
    PauseGuard = TRUE
    KeepGuard = TRUE
INVARIANT OneWorkerOneTask WaitsFirst MadeOnce OnePlace InBudget QuietPause KeepsWhatIsSame
PROPERTY Delivers
