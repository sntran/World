\* The fault model: a busy person can be hired (HireGuard = FALSE). The
\* checker must find a person that works for a construction that does
\* not hold it (OnePlace is violated).
SPECIFICATION Spec
CONSTANTS
    Builds <- MCBuilds
    Tasks <- MCTasks
    BuildOf <- MCBuildOf
    Waits <- MCWaits
    Trade <- MCTrade
    People <- MCPeople
    Skill <- MCSkill
    Budget <- MCBudget
    Guard = TRUE
    HireGuard = FALSE
INVARIANT OnePlace
