\* The fault model: a task can start in a pause (PauseGuard = FALSE). The
\* checker must find a task in work that was not in work at the start of
\* the pause (QuietPause is violated).
SPECIFICATION Spec
CONSTANTS
    Builds <- MCBuilds
    Tasks <- MCTasks
    BuildOf <- MCBuildOf
    Waits <- MCWaits
    Trade <- MCTrade
    People <- MCPeople
    Skill <- MCSkill
    Budget <- MCBudget
    Pauses = 1
    Guard = TRUE
    HireGuard = TRUE
    PauseGuard = FALSE
    KeepGuard = TRUE
INVARIANT QuietPause
