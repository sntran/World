<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World</title>
<style>
  :root { --paper: #f4f1e6; --ink: #222; --line: #c9c2ad; --soft: #6b6656; --mark: #c8551b; }
  @media (prefers-color-scheme: dark) { :root { --paper: #1d1f22; --ink: #e8e6df; --line: #45484d; --soft: #a19d92; --mark: #f08a4b; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: var(--paper); color: var(--ink); display: grid; grid-template-columns: 340px 1fr; grid-template-rows: auto 1fr; height: 100vh; }
  header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; padding: 8px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; }
  header nav a { color: inherit; margin-right: 12px; }
  #counts { color: var(--soft); font-variant-numeric: tabular-nums; }
  aside { padding: 8px 16px; overflow: auto; border-right: 1px solid var(--line); }
  aside h2 { font-size: 13px; margin: 14px 0 4px; color: var(--soft); text-transform: uppercase; letter-spacing: .04em; }
  form { display: grid; gap: 6px; }
  label { display: grid; gap: 2px; font-size: 12px; color: var(--soft); }
  input, select, textarea, button { font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; min-height: 32px; }
  textarea { min-height: 64px; font-family: ui-monospace, monospace; font-size: 12px; }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  td { border-top: 1px solid var(--line); padding: 2px 4px; vertical-align: top; }
  td.n { font-variant-numeric: tabular-nums; }
  ol { list-style: none; margin: 0; padding: 0; font-size: 12px; }
  ol li { border-top: 1px solid var(--line); padding: 3px 0; }
  ol li time { color: var(--soft); font-variant-numeric: tabular-nums; margin-right: 6px; }
  main { position: relative; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  #message { position: absolute; left: 16px; bottom: 12px; margin: 0; color: var(--soft); }
  #lapse { position: absolute; left: 16px; top: 12px; margin: 0; font: 600 16px/1.3 system-ui, sans-serif; color: #fff; text-shadow: 0 1px 3px #000a; max-width: calc(100% - 32px); }
  #lapsebar { position: absolute; right: 16px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: end; background: var(--paper); padding: 6px; border-radius: 6px; max-width: calc(100% - 32px); }
  #lapsebar[hidden] { display: none; }
  @media (max-width: 700px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 55vh auto; height: auto; }
    main { grid-row: 2; height: 55vh; }
    aside { grid-row: 3; border: 0; }
  }
</style>
<script type="importmap">{"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
</head>
<body>
<header>
  <h1>World</h1>
  <nav><a href="review.html">The models</a><a href="replay.html">A replay</a></nav>
  <span id="counts" aria-live="polite"></span>
</header>
<aside>
  <h2>Build a model</h2>
  <form id="job">
    <label>Blueprint <select id="blueprint" required></select></label>
    <label>Options (JSON) <textarea id="options">{}</textarea></label>
    <div class="row">
      <label>Level <select id="level"><option>near</option><option>mid</option><option selected>far</option></select></label>
      <label>Workers <input id="workers" type="number" min="1" max="64" value="4"></label>
      <label>Seconds <input id="seconds" type="number" min="1" placeholder="no limit"></label>
    </div>
    <button type="submit">Build</button>
    <p id="answer" role="status"></p>
  </form>
  <h2>The places</h2>
  <table id="places"></table>
  <h2>The constructions</h2>
  <table id="builds"></table>
  <h2>The people</h2>
  <table id="people"></table>
  <h2>The events</h2>
  <ol id="events"></ol>
</aside>
<main><canvas id="view"></canvas><p id="message">The world starts.</p><p id="lapse" aria-live="polite"></p>
  <div id="lapsebar" hidden>
    <button id="play" type="button">Pause</button>
    <label>Days in a second <select id="speed"><option>5</option><option>10</option><option selected>20</option><option>50</option><option>100</option><option>500</option></select></label>
    <label>View <select id="viewsel"><option value="three_quarters">Three quarters</option><option value="front">Front</option><option value="side">Side</option><option value="back">Back</option><option value="base">The base</option><option value="above">Above</option></select></label>
    <label><span>Turn</span> <input id="turn" type="checkbox"></label>
    <button id="copycam" type="button">Copy the camera</button>
  </div>
</main>
<script type="module">
// The world (docs/plans/0001-people-build-on-demand.md, R24): the people of
// the node, and each construction on its lot as its elements arrive. The
// page reads the stream of the world (GET /events): first the events of
// the past from the log of the node, then each new event. A person is a
// figure on the lot of the construction that holds it: it walks to the
// lot when a construction hires it, and works when it has a task. Each
// element (a part that a person made) comes as a GLB of its own
// (/builds/ID/elements/KEY.glb) at its place in the model.
//
// The map of the yard (plan 0002, D6 and D7): the places of the node (GET
// /places) at their points, each construction on a lot at the place of
// its order (the events of the yard), and the trucks of the haul on their
// drives: a truck drives to the source of its load, then to its place.
//
// ?events=URL reads a recorded stream (one event of JSON on each line),
// ?places=URL the places, and ?files=URL the folder of its elements, for
// a test with no server.
//
// The time lapse (plan 0006, D11): ?follow=ORDER (or ?follow=1, the first
// construction) follows one construction on the clock of its log, at
// ?days=N days of the world in one second of the page (20 by default),
// the same for each step and each pause: a film is the days of the site
// over N seconds. The camera turns with the mouse or a finger, has views
// (?view=three_quarters, front, side, back, base, above), a slow turn
// (?turn=1), and takes ?cam=x,y,z, ?target=x,y,z (m, in the frame of the
// lot) and ?fov=deg. ?still=1 waits for window.TIMELAPSE.to(day) (a
// video, scripts/timelapse.mjs). ?worker=URL is the GLB of a person with
// the animations of the work (an order of the blueprint person). An
// element whose GLB the node does not keep now (5 minutes after the end
// of its construction) does not show.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import { light } from './scene.js';

const params = new URLSearchParams(location.search);
const $ = (id) => document.getElementById(id);
const files = params.get('files') ?? '';

// The scene: a ground with a lot for each construction.
const canvas = $('view');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
// A part grows from its foot to its top over the days of its task.
renderer.localClippingEnabled = true;
renderer.setPixelRatio(devicePixelRatio);
const scene = new THREE.Scene();
const style = getComputedStyle(document.body);
scene.background = new THREE.Color(style.backgroundColor);
const stage = light(renderer, scene);
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 8000);
camera.position.set(40, 45, 70);
const controls = new OrbitControls(camera, canvas);
controls.target.set(20, 0, 10);
const grid = new THREE.GridHelper(400, 80, 0x9a927c, 0xc9c2ad);
scene.add(grid);
const mark = new THREE.MeshStandardMaterial({ color: style.getPropertyValue('--mark').trim() });
const loader = new GLTFLoader();

// The places of the yard: a ground of the color of its kind at its point
// (x to the right, y of the yard to -z), and a row of the table with its
// state. A place with a building is closed until the yard opens it.
const KINDS = { supplier: 0x8f8a7a, warehouse: 0x6f8fa8, factory: 0xb0784a, site: 0x7f9a5c };
const places = new Map();
// The name of a place on the map: a sprite of text that faces the camera.
function label(text, x, z, y = 4) {
  const c = document.createElement('canvas');
  c.width = 256;
  c.height = 64;
  const g = c.getContext('2d');
  g.font = '600 36px system-ui, sans-serif';
  g.fillStyle = style.color;
  g.textAlign = 'center';
  g.fillText(text, 128, 44);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false }));
  sprite.scale.set(80, 20, 1);
  sprite.position.set(x, y, z);
  sprite.userData.label = true;
  return sprite;
}
const yard = await fetch(params.get('places') ?? '/places').then((r) => r.json()).catch(() => ({ places: [] }));
// The sun and its shadows cover the yard: each place, 40 m round it.
const area = new THREE.Box3(new THREE.Vector3(-40, 0, -40), new THREE.Vector3(80, 30, 60));
for (const p of yard.places) area.expandByPoint(new THREE.Vector3(p.at[0] - 40, 0, -p.at[1] - 40)).expandByPoint(new THREE.Vector3(p.at[0] + 40, 30, -p.at[1] + 40));
// The box of a terrain on the yard (plan 0006, D4): the point of the
// place is the game point `origin`; the game Z goes to the south, the y
// of the yard to the north.
const terrainBox = (p) => {
  const [ox, oz] = p.terrain.origin;
  const [x0, z0, x1, z1] = p.terrain.box;
  return new THREE.Box3(new THREE.Vector3(p.at[0] + x0 - ox, 0, -(p.at[1] + oz - z0)), new THREE.Vector3(p.at[0] + x1 - ox, 0, -(p.at[1] + oz - z1)));
};
for (const p of yard.places) if (p.terrain) area.union(terrainBox(p).expandByPoint(new THREE.Vector3(p.at[0], 180, -p.at[1])));
stage.fit(area);
const ready = [];
for (const p of yard.places) {
  let ground;
  if (p.terrain) {
    // The true ground of the place, from the Vũng Tàu game (plan 0006,
    // D3): the GLB is in the frame of World from the point of the place
    // (x east, y north, z up); its glTF x is to the west and its z to
    // the north, so a half turn puts it on the yard.
    ground = new THREE.Group();
    ground.position.set(p.at[0], 0, -p.at[1]);
    ground.rotation.y = Math.PI;
    scene.add(ground);
    ready.push(loader.loadAsync(p.terrain.ground).then((g) => { stage.shade(g.scene); ground.add(g.scene); }).catch(() => {}));
    // The sea round the ground, at the height 0.
    const box = terrainBox(p);
    const size = box.getSize(new THREE.Vector3());
    const middle = box.getCenter(new THREE.Vector3());
    // A film has the sea to the horizon; the map keeps the yard clear.
    const margin = params.get('follow') ? 6000 : 200;
    const sea = new THREE.Mesh(new THREE.PlaneGeometry(size.x + margin, size.z + margin), new THREE.MeshStandardMaterial({ color: 0x3f7f9f, roughness: 0.3 }));
    sea.rotation.x = -Math.PI / 2;
    sea.position.set(middle.x, 0.02, middle.z);
    sea.receiveShadow = true;
    sea.name = 'sea';
    scene.add(sea);
    const top = p.terrain.lots[0];
    scene.add(label(p.name, top.yard[0], -top.yard[1] + 42, top.height + 4));
  } else {
    ground = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: KINDS[p.kind] ?? 0x999999, transparent: true, opacity: 0.3 }));
    ground.rotation.x = -Math.PI / 2;
    ground.position.set(p.at[0], 0.01, -p.at[1]);
    ground.userData.flat = true;
    scene.add(ground);
    scene.add(label(p.name, p.at[0], -p.at[1] + 42));
  }
  const row = $('places').insertRow();
  row.insertCell().textContent = p.name;
  row.insertCell().textContent = p.kind;
  const state = row.insertCell();
  state.textContent = p.building ? 'closed' : 'open';
  places.set(p.name, { ...p, ground, state, lots: 0 });
}
// The point of a place: on a terrain, the first lot at the height of its ground.
const point = (name) => {
  const p = places.get(name);
  const top = p?.terrain?.lots?.[0];
  if (top) return new THREE.Vector3(top.yard[0], top.height, -top.yard[1]);
  return p ? new THREE.Vector3(p.at[0], 0, -p.at[1]) : new THREE.Vector3();
};
// The view of the map: the middle of the places, from the front and over.
// The grid is under the flat places only: a place with a terrain has its
// ground and its sea.
const spread = (list) => {
  const xs = list.map((p) => p.at[0]);
  const ys = list.map((p) => p.at[1]);
  const span = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys)) + 120;
  return { x: (Math.min(...xs) + Math.max(...xs)) / 2, z: -(Math.min(...ys) + Math.max(...ys)) / 2, span };
};
if (places.size) {
  const all = spread(yard.places);
  const flat = yard.places.filter((p) => !p.terrain);
  const g = flat.length ? spread(flat) : all;
  grid.position.set(g.x, 0, g.z);
  grid.scale.setScalar(g.span / 400);
  camera.position.set(all.x, all.span * 1.1, all.z + all.span * 1.25);
  controls.target.set(all.x, 0, all.z);
}

// A lot for each construction, in rows of four, 30 m apart; on the map, a
// lot at the place of its order.
const LOT = 30;
const builds = new Map();
const at = new Map();
function lot(id) {
  if (builds.has(id)) return builds.get(id);
  const n = builds.size;
  const group = new THREE.Group();
  group.position.set((n % 4) * LOT, 0, Math.floor(n / 4) * LOT);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(LOT - 4, LOT - 4), new THREE.MeshStandardMaterial({ color: 0xb8ad8f, transparent: true, opacity: 0.35 }));
  ground.rotation.x = -Math.PI / 2;
  ground.name = 'lot';
  group.add(ground);
  if (at.has(id)) settle(group, ...at.get(id));
  scene.add(group);
  const row = $('builds').insertRow();
  row.insertCell().textContent = id.slice(0, 12);
  const state = row.insertCell();
  const b = { id, group, state, tasks: 0, done: 0, elements: 0, status: 'plan', parts: {} };
  builds.set(id, b);
  return b;
}

// A lot at a place: the next lot of the place, 30 m apart. On a terrain,
// the lot of the yard (or the next one) at the height of its ground, with
// its turn from the north to the east (plan 0006, D5): the front of a
// model (+y of World, +z of glTF) looks to the south with no turn of the
// group, and to the north with a half turn.
function settle(group, name, lotName) {
  const p = places.get(name);
  if (!p) return;
  const lots = p.terrain?.lots ?? [];
  if (lots.length) {
    const l = lots.find((l) => l.name === lotName) ?? lots[p.lots % lots.length];
    group.position.set(l.yard[0], l.height, -l.yard[1]);
    group.rotation.y = Math.PI - THREE.MathUtils.degToRad(l.turn);
    group.getObjectByName('lot').visible = false;
    p.lots += 1;
    return;
  }
  group.position.copy(point(name)).add(new THREE.Vector3((p.lots % 2) * LOT - LOT / 2, 0, -Math.floor(p.lots / 2) * LOT));
  p.lots += 1;
}

// The trucks: a box of the size of a van; a drive of 2 s to the source of
// a load, then to its place. A rented truck goes back to the gate.
const trucks = new Map();
const van = new THREE.BoxGeometry(2.1, 2.6, 6);
function truck(name, place) {
  if (trucks.has(name)) return trucks.get(name);
  const mesh = new THREE.Mesh(van, mark);
  mesh.position.copy(point(place)).add(new THREE.Vector3(0, 1.3, 0));
  scene.add(mesh);
  const t = { name, mesh, from: mesh.position.clone(), to: mesh.position.clone(), start: 0 };
  trucks.set(name, t);
  return t;
}
function drive(t, place) {
  t.from.copy(t.mesh.position);
  t.to.copy(point(place)).add(new THREE.Vector3(0, 1.3, 0));
  t.start = performance.now();
}

// A model as a person sees it: the COLOR_0 of a model with a surface is
// data for a shader (World.Surface), not a color, and a collision box is
// not seen.
function plain(model) {
  model.traverse((o) => {
    if (o.isMesh && model.userData.surface) o.material.vertexColors = false;
    if (o.userData.collision) o.visible = false;
  });
  return model;
}

// The GLB of an element, once for each build and key; a copy for each place.
const glbs = new Map();
function element(id, key) {
  const url = `${files}/builds/${id}/elements/${key}.glb`;
  if (!glbs.has(url)) glbs.set(url, loader.loadAsync(url).then((g) => plain(g.scene)));
  return glbs.get(url);
}

// The people: a figure each, from the catalog (a person at the level far),
// or a plain body when the catalog is not there.
// The people: a figure each, from ?worker=URL (a person with the
// animations of the work, plan 0006, D10), or the man of the catalog (a
// person at the level far), or a plain body when neither is there.
const plainBody = () => {
  const m = new THREE.Mesh(new THREE.CapsuleGeometry(0.25, 1.2, 4, 8), mark);
  m.position.y = 0.85;
  const g = new THREE.Group();
  g.add(m);
  return { scene: g, clips: [] };
};
const body = loader.loadAsync(params.get('worker') ?? `${files}/m/catalog.far.glb?name=man`)
  .then((g) => ({ scene: g.scene, clips: g.animations }))
  .catch(() => plainBody());
// The work of each trade (World.People.Pose.work/0).
const WORK = { caster: 'pour', carpenter: 'set_panel', scaffolder: 'climb', rigger: 'guide', mason: 'trowel', finisher: 'trowel', smith: 'hammer', sculptor: 'hammer', surveyor: 'guide', builder: 'carry' };
const people = new Map();
const gate = new THREE.Vector3(-20, 0, -20);
// A figure that moves: a person of the census, a helper of its crew, or a
// carrier of the path.
let seeds = 0;
function worker(kit, work) {
  const figure = SkeletonUtils.clone(kit.scene);
  figure.position.copy(gate);
  stage.shade(figure);
  scene.add(figure);
  return { figure, mixer: kit.clips.length ? new THREE.AnimationMixer(figure) : null, clips: kit.clips, clip: null, work, seed: ++seeds, route: null, place: null };
}
async function person(name) {
  if (people.has(name)) return people.get(name);
  const p = Object.assign(worker(await body, 'carry'), { name, task: null, build: null, crew: [], row: $('people').insertRow() });
  p.row.insertCell().textContent = name;
  p.trade = p.row.insertCell();
  p.status = p.row.insertCell();
  people.set(name, p);
  return p;
}
// A clip of a person (walk, the work of its trade), or none.
function act(p, name) {
  if (!p.mixer || p.clip === name) return;
  const clip = p.clips.find((c) => c.name === name);
  p.mixer.stopAllAction();
  p.clip = name;
  if (clip) p.mixer.clipAction(clip).play();
}
// The people at work (plan 0006, D10; the owner, 2026-11-10 and 11): the
// people of a stage walk in on the way to the lot (the path of the hill
// when there is one) before its work starts, and wait at the head of the
// way. A person and its crew go to the place of their task, each to a
// place of its own round the work: on the ground round the part, or on
// the deck of the scaffold of the band (they climb the ladder at the
// corner of the scaffold to it, and down from it). There each does the
// work cycle of its trade (D12, below): it takes a load at the source of
// its place, carries it to a point of the work on the part, and works
// there. A free person gets the materials ready at the heap, and at the
// end of a stage the people walk out on the way. The clock is the second of the
// film (of the page, with no time lapse); a walk is at SPEED m in a
// second of the film, and a way from one place of the lot to another
// takes at most HOP s.
const WAY = 4;
const SPEED = 12;
const HOP = 2.5;
const CROWD = 60;
const clock = (day) => (lapse ? (day === undefined ? lapse.t : lapse.film(day)) : performance.now() / 1000);
const hash = (seed, k) => {
  const x = Math.sin(seed * 12.9898 + k * 78.233) * 43758.5453;
  return x - Math.floor(x);
};
const smooth = (f) => f * f * (3 - 2 * f);
const helpers = new Set();
const lotAt = (b) => b.group.getWorldPosition(new THREE.Vector3());

// The places of a lot. `c` is the center at the level of the place, `rx`
// and `rz` the half sizes of its ring, `r` the ring of the people.
function lotRing(b) {
  return { c: lotAt(b), rx: 10, rz: 10, r: 1, ground: true };
}
// The head of the way into the lot: the people wait there.
function restOf(b) {
  return { c: way(b)[0].clone(), rx: 3, rz: 3, r: 1, ground: true, rest: true };
}
// The place of a task: the deck of the scaffold of its band (scaffold_N of
// a task ..._N), or the ground round its parts, or the ring of the lot.
function placeOf(b, task) {
  const m = /_(\d+)$/.exec(task ?? '');
  const key = m && 'scaffold_' + m[1];
  const sc = key && b.parts[key];
  const own = b.parts[(task ?? '').replace(/^again\//, '')];
  const list = sc?.length ? sc : own?.length ? own : null;
  if (!list) return lotRing(b);
  const name = sc?.length ? key : task;
  const old = b.rings?.[name];
  if (old?.list === list && old.n === list.length) return old;
  const box = new THREE.Box3();
  for (const part of list) box.expandByObject(part);
  const size = box.getSize(new THREE.Vector3());
  const y = lotAt(b).y;
  const pl = sc?.length && box.min.y > y + 1
    ? { c: box.getCenter(new THREE.Vector3()).setY(box.min.y + 0.05), rx: size.x / 2, rz: size.z / 2, r: 0.85 }
    : { c: box.getCenter(new THREE.Vector3()).setY(y), rx: size.x / 2 + 0.8, rz: size.z / 2 + 0.8, r: 1, ground: true };
  // The ladder: the corner of the scaffold to the side of the way in. Its
  // foot is on what is under it (the base, the dome); a ladder at the edge
  // of the base goes up to the base from the ground.
  if (!pl.ground) {
    const a = angleOf(pl, way(b)[0]);
    pl.ladder = ringAt(pl, a, 1);
    const foot = surface(b, pl.ladder) ?? pl.ladder.clone().setY(y);
    pl.down = [{ at: pl.ladder }, { at: foot, clip: 'climb' }];
    const base = b.parts.be?.length && new THREE.Box3();
    if (base && foot.y > y + 0.5) {
      for (const part of b.parts.be) base.expandByObject(part);
      const bs = base.getSize(new THREE.Vector3());
      const ring = { c: lotAt(b), rx: bs.x / 2 + 0.4, rz: bs.z / 2 + 0.4, r: 1 };
      const edge = ringAt(ring, angleOf(ring, foot));
      const top = surface(b, ringAt(ring, angleOf(ring, foot), 0.9)) ?? foot;

// The carriers of a site with no machine (the means carry_path of the

const CARRIERS = 24;

  const points = path.map(([x, z]) => {
    const at = new THREE.Vector3(place.at[0] + x - ox, 400, -(place.at[1] + oz - z));

// The parts of a task in a time lapse: the page reads the elements of the

async function grow(b, e) {
  const key = e.data.task.replace(/^again\//, '');
  // The end of this task: before the next start of a task of its name (a
  // jump of the film can pass the end, and a later task of the name is
  // not this one).

  const to = (lapse.pending[done].at - lapse.t0) / DAY;
  const from = (e.at - lapse.t0) / DAY;
  for (let i = done + 1; i < lapse.pending.length; i++) {
    const x = lapse.pending[i];
    if (x.order !== e.order || x.kind !== 'element' || x.data.task !== key) break;
    const glb = await element(x.order, x.data.glb).catch(() => null);
    if (!glb) continue;
    x.shown = true;
    const part = glb.clone();
    part.matrixAutoUpdate = false;
    part.matrix.fromArray(x.data.matrix);
    stage.shade(part);
    b.group.add(part);
    (b.parts[key] ??= []).push(part);
    part.updateWorldMatrix(true, true);
    const box = new THREE.Box3().setFromObject(part);
    const plane = new THREE.Plane(new THREE.Vector3(0, -1, 0), box.min.y);

    g.plane.constant = g.box.min.y + (g.box.max.y - g.box.min.y + 0.05) * f;
    if (f < 1 && g.part.parent) return true;
    g.part.traverse((o) => { if (o.isMesh) o.material.clippingPlanes = []; });
    return false;
  });

// The grass and the bushes of a site in a pause (plan 0006, D8): on the
// ground of the lot and round the base, more with the years (`weeds` of
// the event, 0 to 1); none after the repair.
const GRASS = 700;
async function grass(b, weeds) {
  // The grass of the lot where the pause is (the lot can change).
  const here = b.group.getWorldPosition(new THREE.Vector3());
  if (b.grass && b.grassAt?.distanceTo(here) > 1) {
    for (const g of b.grass) g.removeFromParent();
    b.grass = null;
  }
  if (!b.grass) {
    b.grassAt = here;
    const place = [...places.values()].find((p) => p.terrain);
    await Promise.all(ready);
    const blade = new THREE.InstancedMesh(new THREE.ConeGeometry(0.25, 1, 5), new THREE.MeshStandardMaterial({ color: 0x5e7d34, roughness: 1 }), GRASS);
    const bush = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 0), new THREE.MeshStandardMaterial({ color: 0x46612a, roughness: 1 }), GRASS / 7);
    const m = new THREE.Matrix4();
    const at = b.group.getWorldPosition(new THREE.Vector3());
    let seed = 7;
    const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    const put = (mesh, i, size) => {
      const a = rand() * 2 * Math.PI;
      const r = 5 + rand() * 15;
      const p = new THREE.Vector3(at.x + Math.cos(a) * r, 1000, at.z + Math.sin(a) * r);

      const hit = [...(b.parts.be ?? []), place?.ground].filter(Boolean).flatMap((o) => down.intersectObject(o, true))

  b.grass[1].count = Math.round((GRASS / 7) * weeds);

// The people now: each figure at its place and with its clip (with no
// motion when the reader asks for none).
function walking(now, dt) {
  const t = clock();
  for (const p of people.values()) step(p, t, dt, now);
  for (const h of helpers) step(h, t, dt, now);

    if (b.going?.length) goes(b, t);

// come down a ladder on all the scaffolds, so the scaffolds go together.
function goes(b, t) {
  const last = Math.max(...b.going.map((g) => g.t));
  b.going = b.going.filter((g) => {
    if ((g.scaffold ? last : g.t) > t) return true;
    for (const part of g.list) part.removeFromParent();
    g.list.ladder?.removeFromParent();
    return false;

}

// What an event tells, in words.
const say = (e) => {
  const d = e.data ?? {};
  switch (e.kind) {
    case 'requested': return `A construction opens, at the level ${d.level}.`;
    case 'plan_made': return `The plan: ${d.tasks.length} tasks.`;
    case 'hired': return `${e.who} (${d.trade}) comes to the construction.`;
    case 'released': return `${e.who} goes back.`;
    case 'task_started': return `${e.who} starts ${d.task}.`;
    case 'task_done': return `${e.who} ends ${d.task}.`;
    case 'element': return `${d.part} is in place.`;
    case 'done': return `The model is done (${Math.round(d.bytes / 1024)} KB).`;
    case 'stopped': return `The construction stops: ${d.reason}.`;
    case 'failed': return `The construction fails: ${d.message}.`;
    case 'run_done': return `The construction took ${(d.ms / 1000).toFixed(1)} s.`;
    case 'place_raised': return `The people raise the building of ${d.place}.`;
    case 'place_open': return `${d.place} opens.`;
    case 'place_held': return `A construction waits for ${d.place}.`;
    case 'place_started': return `A construction starts at ${d.place}.`;
    case 'truck_made': return `${d.truck} joins the haul.`;
    case 'truck_joined': return `${d.truck} is at ${d.at}.`;
    case 'parts_asked': return `The materials of ${d.task} go to ${d.place}.`;
    case 'parts_here': return `The materials of ${d.task} are there.`;
    case 'haul_asked': return `${d.loads.length} loads from ${d.from} to ${d.to}.`;
    case 'loaded': return `${d.truck} takes ${d.load} at ${d.at}.`;
    case 'unloaded': return `${d.truck} puts ${d.load} down at ${d.at}.`;
    case 'hauled': return `Each load of ${d.for} is there.`;
    default: return e.kind;
  }
};

// An event of the yard or of the haul: the places, the lots, the trucks.
function yardEvent(e) {
  const d = e.data ?? {};
  const p = places.get(d.place);
  if (e.kind === 'place_raised' && p) p.state.textContent = 'raised';
  if (e.kind === 'place_open' && p) p.state.textContent = 'open';
  if (['place_raised', 'place_held', 'place_started'].includes(e.kind) && !at.has(d.order)) {
    at.set(d.order, [d.place, d.lot]);
    if (builds.has(d.order)) settle(builds.get(d.order).group, d.place, d.lot);
  }
  if (e.kind === 'truck_joined') truck(d.truck, d.at);
  if (e.kind === 'loaded') drive(truck(d.truck, 'gate'), d.at);
  if (e.kind === 'unloaded') {
    const t = truck(d.truck, d.at);
    drive(t, d.at);
    if (d.truck.startsWith('rented_')) t.back = true;
  }
}

// The day of the event that the page takes now (in a time lapse).
let eventDay = 0;
async function take(e) {
  if (lapse) eventDay = (e.at - lapse.t0) / DAY;
  if (e.order === 'yard' || e.order === 'haul') {
    yardEvent(e);
    return log(e);
  }
  const b = lot(e.order);
  const d = e.data ?? {};
  if (e.kind === 'plan_made') b.tasks = d.tasks.length;
  if (e.kind === 'hired') {
    const p = await person(e.who);
    p.trade.textContent = d.trade;
    p.build = b;
    p.status.textContent = `at ${b.id.slice(0, 12)}`;
    p.job = d.trade;
    p.work = WORK[d.trade] ?? 'carry';
    // A person that came with its stage is on the lot; another walks in.
    if (p.lot !== b || p.gone || p.leaving) come(b, p, clock(eventDay));
    p.lot = b;
    p.waiting = false;
  }
  // A free person and its crew wait at the head of the way (the
  // construction can take them again soon); they walk out at the end of
  // the stage.
  if (e.kind === 'released') {
    const p = await person(e.who);
    const t = clock(eventDay);
    prepare(b, p, t);
    p.waiting = true;
    p.task = null;
    p.status.textContent = 'free';
  }
  if (e.kind === 'task_started') {
    const p = await person(e.who);
    p.task = d.task;
    p.status.textContent = `works on ${d.task}`;
    // The parts of the task (in a time lapse, from its start); the people on
    // a scaffold that the task takes down come down from it first.
    if (lapse) {
      await grow(b, e);
      // (The parts go after the end of the task.)
      let end = false;
      for (const x of lapse.pending) {
        if (x.order !== e.order || x.who !== e.who) continue;
        if (x.kind === 'element_removed') comeDown(b, b.parts[x.data.task], clock(eventDay));
        else if (end) break;
        else if (x.kind === 'task_done') end = true;
      }
    }
    // The person and its crew go to the place of the task, each to its own
    // place round it (plan 0006, D10: the crew of the rate of its work,
    // `crew` of the event). A crew that grows takes people that walk in;
    // a helper with no work in this task waits.
    const t = clock(eventDay);
    const pl = placeOf(b, d.task);
    const n = d.crew ?? 1;
    // The free helpers nearest to the place.
    const crew = (b.pool ?? []).filter((h) => !h.task && !h.leaving && !h.gone)
      .map((h) => [where(h, t).at.distanceTo(pl.c), h]).sort((x, y) => x[0] - y[0]).slice(0, n - 1).map(([, h]) => h);
    while (crew.length < n - 1) crew.push(await helper(b, t));
    p.crew = crew;
    const base = angleOf(pl, way(b)[0]) + 0.5;
    [p, ...crew].forEach((w, k) => {
      if (w !== p) Object.assign(w, { task: d.task, boss: p, work: p.work });
      toPlace(b, w, pl, base + (2 * Math.PI * k) / n, t);
    });
    b.task = d.task;
    b.workY = pl.c.y - b.group.position.y;
    // The work now, and the lift to its deck.
    b.workPl = pl;
    if (!pl.ground) b.lift = liftOf(b, pl) ?? b.lift;
  }
  // The crew of a task is free: it goes on at its place until a task
  // takes it.
  if (e.kind === 'task_done') {
    b.done += 1;
    const p = await person(e.who);
    p.task = null;
    for (const h of p.crew ?? []) Object.assign(h, { task: null, boss: null });
    p.crew = [];
  }
  if (e.kind === 'stage_started') {
    b.stage = d;
    b.lift = b.workPl = null;
    if (b.pile) b.pile.visible = d.work === 'build';
    depart(b, clock(eventDay));
    // A change makes a new statue: it has no age.
    if (d.work === 'change') b.aged = null;
    // The carriers of the path, with the means of the time (plan 0006, D6).
    carriers(b, d.work === 'build' && d.means?.includes('carry_path') ? d.path : null, clock(eventDay));
    if (d.date) b.date0 = new Date(Date.parse(d.date) - d.from * 86400000);
    // A change of the lot: the people take down the old parts where they
    // stand; the next build is on the new lot.
    if (d.lot && d.work === 'change') b.nextLot = d.lot;
    if (d.work === 'build' && b.nextLot) {
      settle(b.group, at.get(b.id)?.[0] ?? 'nui_nho', b.nextLot);
      b.nextLot = null;
    }
    // The people of the stage walk in before its work.
    if (d.work !== 'pause') await arrive(b, e, clock(eventDay));
  }
  if (e.kind === 'aged') { b.aged = d; await grass(b, d.weeds); }
  if (e.kind === 'repaired') { b.aged = null; await grass(b, 0); }
  if (e.kind === 'element' && e.shown) b.elements += 1;
  if (e.kind === 'element' && !e.shown) {
    b.elements += 1;
    const glb = await element(e.order, d.glb).catch(() => null);
    if (glb) {
      const part = glb.clone();
      part.matrixAutoUpdate = false;
      part.matrix.fromArray(d.matrix);
      stage.shade(part);
      b.group.add(part);
      (b.parts[d.task] ??= []).push(part);
    }
  }
  // A task that takes down a part (plan 0006, D7): its elements go.
  if (e.kind === 'element_removed') {
    const list = b.parts[d.task] ?? [];
    comeDown(b, list, clock(eventDay));
    // The parts go when the people on them are down.
    (b.going ??= []).push({ list, t: list.down ?? 0, scaffold: d.task.startsWith('scaffold') });
    delete b.parts[d.task];
  }
  if (['done', 'stopped', 'failed'].includes(e.kind)) {
    b.status = e.kind;
    b.lift = b.workPl = null;
    if (b.pile) b.pile.visible = false;
    depart(b, clock(eventDay));
  }
  b.state.textContent = `${b.done} of ${b.tasks} tasks, ${b.elements} elements, ${b.status}`;
  log(e);
}

function log(e) {
  $('counts').textContent = `${people.size} people, ${builds.size} constructions, ${trucks.size} trucks`;
  const li = document.createElement('li');
  const time = document.createElement('time');
  time.textContent = new Date(e.wall).toLocaleTimeString();
  li.append(time, say(e));
  $('events').prepend(li);
  while ($('events').children.length > 40) $('events').lastChild.remove();
}

// The events in the order of their ids, one at a time.
let queue = Promise.resolve();
const events = [];
const next = (e) => { events.push(e); queue = queue.then(() => take(e)).catch((err) => console.error(err)); };

// The time lapse (plan 0006, D11): the events of a recorded log on the
// clock of the log, at `days` days of the world in one second.
const DAY = 86400000;
const VIEWS = {
  three_quarters: { cam: [38, 14, 60], target: [0, 10, 0] },
  front: { cam: [0, 12, 72], target: [0, 10, 0] },
  side: { cam: [72, 12, 0], target: [0, 10, 0] },
  back: { cam: [0, 12, -72], target: [0, 10, 0] },
  base: { cam: [9, 2.5, 20], target: [0, 6, 0] },
  above: { cam: [0.1, 110, 0.1], target: [0, 10, 0] },
};
const vec = (text) => text?.split(',').map(Number);
const down = new THREE.Raycaster();
const lapse = params.get('follow') ? {
  pending: [],
  t0: null,
  day: 0,
  end: 0,
  // The days of the world in one second of the film: of the work, and of
  // a pause.
  days: Number(params.get('days') ?? 5),
  pause: Number(params.get('pause') ?? 365),
  segments: [],
  playing: !params.has('still'),
  turn: params.get('turn') === '1',
  angle: 0,
  view: VIEWS[params.get('view')] ? params.get('view') : 'three_quarters',
  cam: vec(params.get('cam')),
  target: vec(params.get('target')),
  order: null,
  // The events of the days up to `day`, in their order; `t` is the second
  // of the film now.
  t: 0,
  async to(day) {
    this.day = day;
    this.t = this.film(day);
    while (this.pending.length && (this.pending[0].at - this.t0) / DAY <= day) next(this.pending.shift());
    await queue;
    this.place();
  },
  async at(t) {
    this.t = t;
    this.day = this.dayAt(t);
    while (this.pending.length && (this.pending[0].at - this.t0) / DAY <= this.day) next(this.pending.shift());
    await queue;
    this.place();
  },
  // The speed at a day: a pause of the construction is faster.
  rate(day) {
    let rate = this.days;
    for (const s of this.segments) if (s.day <= day) rate = s.pause ? this.pause : this.days;
    return rate;
  },
  // The seconds of the film at a day, and the day at a second of the film.
  // At the start of each stage the day waits WAY s: the people of the
  // stage walk in (or out, at a pause).
  film(day) {
    let t = 0;
    let last = 0;
    for (const s of [...this.segments, { day: Infinity }]) {
      const upto = Math.min(s.day, day);
      if (upto > last) t += (upto - last) / this.rate(last);
      last = Math.max(last, upto);
      if (s.day >= day) break;
    }
    for (const s of this.segments) if (s.hold && s.day < day) t += WAY;
    return t;
  },
  dayAt(t) {
    let lo = 0, hi = this.end;
    for (let k = 0; k < 60; k++) { const mid = (lo + hi) / 2; if (this.film(mid) < t) lo = mid; else hi = mid; }
    return hi;
  },
  // The day waits: the people come, or go.
  holding() {
    return this.t < this.film(this.day) - 1e-6;
  },
  frame(dt) {
    if (this.playing && this.t0 !== null) {
      this.t = Math.min(this.t + dt, this.film(this.end));
      this.day = this.dayAt(this.t);
      while (this.pending.length && (this.pending[0].at - this.t0) / DAY <= this.day) next(this.pending.shift());
    }
    this.place();
  },
  // The height of the top of the parts on the lot (m over the lot), each
  // second of the film.
  top(b) {
    const now = Math.floor(this.t);
    if (b.topAt !== now) {
      b.topAt = now;
      const box = new THREE.Box3();
      for (const list of Object.values(b.parts)) for (const p of list) box.expandByObject(p);
      b.topY = box.isEmpty() ? 0 : box.max.y - b.group.getWorldPosition(new THREE.Vector3()).y;
    }
    return Math.min(b.topY, 60);
  },
  // The camera in the frame of the lot of the construction, and the label.
  place() {
    const b = builds.get(this.order);
    if (!b) return;
    const v = VIEWS[this.view];
    growing(b, this.day);
    // The slow turn: 0.15 rad in each second of the film.
    if (this.turn) this.angle = this.t * 0.15;
    // The camera follows the height of the work, and holds what stands: it
    // aims at the middle of the built height or higher, and goes back as
    // the model rises (a view, not a camera of the URL).
    const top = this.top(b);
    const aim = Math.min(Math.max(b.workY ?? v.target[1], top / 2, v.target[1]), Math.max(top, v.target[1]));
    const lift = this.target ? 0 : aim - v.target[1];
    const back = this.cam ? 1 : Math.max(1, (top + 6) / 26);
    const cam = new THREE.Vector3(...(this.cam ?? v.cam)).multiplyScalar(back).applyAxisAngle(new THREE.Vector3(0, 1, 0), this.angle).add(new THREE.Vector3(0, lift, 0));
    b.group.updateWorldMatrix(true, false);
    camera.position.copy(cam.applyMatrix4(b.group.matrixWorld));
    // The camera stays 10 m over the ground of a hill.
    const hill = [...places.values()].find((p) => p.terrain)?.ground;
    if (hill) {
      down.set(camera.position.clone().setY(1000), new THREE.Vector3(0, -1, 0));
      const hit = down.intersectObject(hill, true)[0];
      if (hit && camera.position.y < hit.point.y + 10) camera.position.y = hit.point.y + 10;
    }
    controls.target.copy(new THREE.Vector3(...(this.target ?? v.target)).add(new THREE.Vector3(0, lift, 0)).applyMatrix4(b.group.matrixWorld));
    const date = b.date0 ? ' · ' + new Date(b.date0.getTime() + this.day * DAY).toISOString().slice(0, 10) : '';
    const stage = b.stage ? ` · ${b.stage.name}` : '';
    const work = b.task && b.stage?.work !== 'pause' ? ` · ${b.task}` : '';
    const old = b.aged && b.stage?.work === 'pause' ? ` · the site gets old (${Math.round(b.aged.days / 365)} years)` : '';
    const r = this.rate(this.day);
    const hold = this.holding() ? (b.stage?.work === 'pause' ? 'the people leave the site' : 'the people come to the site') : null;
    const speed = hold ?? (r === 365 ? 'a year in a second' : `${r} days in a second`);
    $('lapse').textContent = `Day ${Math.floor(this.day) + 1}${date}${stage}${work}${old} · ${speed}`;
    // The old statue: the concrete gets darker in a pause, and weeds
    // grow on the base (D8).
    const dirt = b.aged ? b.aged.dirt : 0;
    const weeds = b.aged ? b.aged.weeds : 0;
    if (dirt !== b.dirt) {
      b.dirt = dirt;
      const base = new Set(b.parts.be ?? []);
      const green = new THREE.Color(0x4f6b32);
      b.group.traverse((o) => {
        if (!o.isMesh || !o.material?.color) return;
        o.userData.base ??= o.material.color.clone();
        o.material = o.material.clone();
        o.material.color.copy(o.userData.base).multiplyScalar(1 - 0.55 * dirt);
        let p = o;
        while (p && !base.has(p)) p = p.parent;
        if (p) o.material.color.lerp(green, 0.45 * weeds);
      });
    }
  },
} : null;
// The sky of a film, and no names of the places in front of the camera.
if (lapse) {
  scene.background = new THREE.Color(0x9fc3e0);
  scene.traverse((o) => { if (o.userData.label) o.visible = false; });
  // A film of a lot on the hill: the flat yard of the node is not in it.
  grid.visible = false;
  scene.traverse((o) => { if (o.userData.flat) o.visible = false; });
}
if (lapse && params.get('fov')) {
  camera.fov = Number(params.get('fov'));
  camera.updateProjectionMatrix();
}

if (params.get('events')) {
  const text = await (await fetch(params.get('events'))).text();
  const all = text.split('\n').filter(Boolean).map((line) => JSON.parse(line));
  if (lapse) {
    // The construction to follow, and its days.
    const first = all.find((e) => e.order !== 'yard' && e.order !== 'haul');
    lapse.order = params.get('follow') === '1' ? first?.order : params.get('follow');
    const own = all.filter((e) => e.order === lapse.order);
    lapse.t0 = own[0]?.at ?? 0;
    lapse.end = ((own.at(-1)?.at ?? 0) - lapse.t0) / DAY;
    lapse.segments = own.filter((e) => e.kind === 'stage_started' || e.kind === 'stage_done')
      .map((e) => ({ day: (e.at - lapse.t0) / DAY, pause: e.kind === 'stage_started' && e.data.work === 'pause', hold: e.kind === 'stage_started' }));
    lapse.pending = all;
    await lapse.to(0);
  } else {
    for (const e of all) next(e);
  }
} else {
  const source = new EventSource('/events');
  source.onmessage = (m) => next(JSON.parse(m.data));
  source.onerror = () => { $('message').textContent = 'The stream of the world stops; the page tries again.'; };
  source.onopen = () => { $('message').textContent = ''; };
  fetch('/blueprints').then((r) => r.json()).then((list) => {
    for (const b of list) $('blueprint').add(new Option(b.name, b.name));
  }).catch(() => {});
}
await queue;
$('message').textContent = events.length ? '' : 'No construction yet.';

// A job from the page: POST /builds.
$('job').onsubmit = async (ev) => {
  ev.preventDefault();
  let options;
  try { options = JSON.parse($('options').value || '{}'); } catch { $('answer').textContent = 'The options are not JSON.'; return; }
  const budget = { workers: Number($('workers').value) };
  if ($('seconds').value) budget.seconds = Number($('seconds').value);
  const r = await fetch('/builds', {
    method: 'POST',
    headers: { 'content-type': 'application/json', accept: 'application/json' },
    body: JSON.stringify({ order: { blueprint: $('blueprint').value, options }, level: $('level').value, budget }),
  });
  const answer = await r.json();
  $('answer').textContent = r.ok ? `The construction ${answer.build} opens.` : answer.errors.map((x) => `${x.path}: ${x.message}`).join('; ');
};

function resize() {
  const { clientWidth: w, clientHeight: h } = canvas.parentElement;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
// The bar of the time lapse.
if (lapse) {
  $('lapsebar').hidden = false;
  $('viewsel').value = lapse.view;
  $('turn').checked = lapse.turn;
  $('speed').value = String(lapse.days);
  $('play').textContent = lapse.playing ? 'Pause' : 'Play';
  $('play').onclick = () => { lapse.playing = !lapse.playing; $('play').textContent = lapse.playing ? 'Pause' : 'Play'; };
  $('speed').onchange = () => { lapse.days = Number($('speed').value); lapse.t = lapse.film(lapse.day); };
  $('viewsel').onchange = () => { lapse.view = $('viewsel').value; lapse.cam = lapse.target = null; lapse.angle = 0; };
  $('turn').onchange = () => { lapse.turn = $('turn').checked; };
  // The camera as the viewer sets it, in the frame of the lot, for the URL.
  controls.addEventListener('start', () => { lapse.turn = false; $('turn').checked = false; });
  controls.addEventListener('end', () => {
    const b = builds.get(lapse.order);
    const inv = b.group.matrixWorld.clone().invert();
    lapse.cam = camera.position.clone().applyMatrix4(inv).toArray().map((x) => Math.round(x * 10) / 10);
    lapse.target = controls.target.clone().applyMatrix4(inv).toArray().map((x) => Math.round(x * 10) / 10);
    lapse.angle = 0;
  });
  $('copycam').onclick = () => {
    const u = new URL(location.href);
    if (lapse.cam) u.searchParams.set('cam', lapse.cam.join(','));
    if (lapse.target) u.searchParams.set('target', lapse.target.join(','));
    u.searchParams.set('fov', String(camera.fov));
    navigator.clipboard?.writeText(u.toString());
    $('copycam').textContent = 'Copied';
  };
}

// The state of the page, for a test: the lots and the people; and the
// time lapse, for a video.
window.WORLD = { builds, people, helpers, places, trucks };
const draw = () => { walking(performance.now(), 1 / 30); controls.update(); renderer.render(scene, camera); };
window.TIMELAPSE = lapse && {
  to: (day) => lapse.to(day).then(draw),
  // The second `t` of the film (the stages at their speeds).
  at: (t) => lapse.at(t).then(draw),
  get end() { return lapse.end; },
  get days() { return lapse.days; },
  get film() { return lapse.film(lapse.end); },
  // The second of the film at a day.
  filmAt: (day) => lapse.film(day),
};
await Promise.all(ready);
window.READY = true;
let last = performance.now();
renderer.setAnimationLoop((now) => {
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  if (lapse) lapse.frame(dt);
  walking(now, dt);
  for (const t of trucks.values()) {
    // A drive takes 2 s; a rented truck goes back to the gate after its load.
    const f = Math.min((now - t.start) / 2000, 1);
    t.mesh.position.lerpVectors(t.from, t.to, still ? 1 : f);
    if (f === 1 && t.back) {
      t.back = false;
      drive(t, 'gate');
    }
  }
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
